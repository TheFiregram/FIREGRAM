<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07060a" />
  <meta name="description" content="FIREGRAM · product-minded builder working across AI, software, Web3, community operations and startup execution." />
  <meta property="og:title" content="FIREGRAM · Builder, Product Thinker, Community Operator" />
  <meta property="og:description" content="I spot what is almost working, find what is missing, and build the next version." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/firegram-profile.webp" />
  <title>FIREGRAM · Portfolio</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
  <link rel="stylesheet" href="styles/theme.css" />

</head>
<body class="portfolio-app">
  <canvas id="ambientCanvas" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="desktop-rail glass" aria-label="Portfolio navigation">
      <a class="rail-brand" href="#/home" aria-label="FIREGRAM home">
        <span class="brand-mark">FG</span>
        <span><strong>FIREGRAM</strong><small>Portfolio / 2026</small></span>
      </a>

      <nav class="rail-nav" id="routeNav">
        <a href="#/home" data-route="home"><span>01</span>Overview</a>
        <a href="#/work" data-route="work"><span>02</span>Selected Work</a>
        <a href="#/strengths" data-route="strengths"><span>03</span>Strengths</a>
        <a href="#/proof" data-route="proof"><span>04</span>Proof of Work</a>
        <a href="#/experience" data-route="experience"><span>05</span>Experience</a>
        <a href="#/about" data-route="about"><span>06</span>About</a>
        <a href="#/contact" data-route="contact"><span>07</span>Contact</a>
      </nav>

      <div class="rail-bottom">
        <div class="rail-status"><i></i><span><strong>Remote-first</strong><small>Available worldwide</small></span></div>
        <div class="rail-socials">
          <a href="https://x.com/TheFiregram" target="_blank" rel="noreferrer">X</a>
          <a href="https://github.com/TheFiregram" target="_blank" rel="noreferrer">GH</a>
          <a href="https://www.linkedin.com/in/firegram" target="_blank" rel="noreferrer">IN</a>
        </div>
      </div>
    </aside>

    <div class="app-workspace">
      <header class="workspace-bar glass">
        <div class="workspace-route">
          <span id="routeIndex">01</span>
          <div><strong id="routeTitle">Overview</strong><small id="routeMeta">FIREGRAM / PORTFOLIO</small></div>
        </div>
        <div class="workspace-actions">
          <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" title="Toggle interface sound"><span class="sound-dot"></span><span class="sound-label">Sound off</span></button>
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
        </div>
      </header>

      <main id="siteContent" class="view-stage" aria-live="polite"></main>
    </div>
  </div>

  <div class="mobile-menu glass" id="mobileMenu" aria-hidden="true">
    <a href="#/home" data-route="home">Overview</a>
    <a href="#/work" data-route="work">Selected Work</a>
    <a href="#/strengths" data-route="strengths">Strengths</a>
    <a href="#/proof" data-route="proof">Proof of Work</a>
    <a href="#/experience" data-route="experience">Experience</a>
    <a href="#/about" data-route="about">About</a>
    <a href="#/contact" data-route="contact">Contact</a>
  </div>

  <script type="module" src="app.js"></script>

</html>
